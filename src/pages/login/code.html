<script>
  function switchTab(mode) {
    const wechatBtn = document.getElementById('tab-wechat-btn');
    const pwdBtn = document.getElementById('tab-password-btn');
    const wechatView = document.getElementById('view-wechat');
    const pwdView = document.getElementById('view-password');

    if (mode === 'wechat') {
      wechatBtn.className = "flex-1 py-2.5 px-2 rounded-lg flex items-center justify-center gap-1.5 transition-all duration-300 bg-surface-container-lowest text-on-surface shadow-sm font-semibold relative";
      pwdBtn.className = "flex-1 py-2.5 px-2 rounded-lg flex items-center justify-center gap-1.5 transition-all duration-300 text-on-surface-variant relative";
      wechatView.classList.remove('hidden');
      pwdView.classList.add('hidden');
    } else {
      pwdBtn.className = "flex-1 py-2.5 px-2 rounded-lg flex items-center justify-center gap-1.5 transition-all duration-300 bg-surface-container-lowest text-on-surface shadow-sm font-semibold relative";

      pwdView.classList.remove('hidden');
      wechatView.classList.add('hidden');
    }
  }

  function togglePasswordVisibility() {
    const input = document.getElementById('password-input');
    const icon = document.getElementById('pwd-icon');
    if (!input || !icon) return;
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility_off';
    }
  }
